# SpidyCrawler
# Runs every 6 hours + manual trigger.
# Stop anytime: Actions → SpidyCrawler → ⋯ → Disable workflow.

name: SpidyCrawler

on:
  workflow_dispatch:   # Manual run from the Actions tab
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (GitHub cron is UTC)
    - cron: "0 */6 * * *"

# Never let two runs overlap (one long run queues the next instead of racing it).
concurrency:
  group: spidycrawler
  cancel-in-progress: false

permissions:
  contents: read        # Least privilege: checkout only needs read access

jobs:
  run-seo-bot:
    runs-on: windows-latest
    timeout-minutes: 60          # Hard cap so a hung run can't burn hours of minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set UTF-8 encoding
        shell: pwsh
        run: |
          chcp 65001
          $OutputEncoding = [console]::InputEncoding = [console]::OutputEncoding = New-Object System.Text.UTF8Encoding
          [System.Console]::OutputEncoding = [System.Text.Encoding]::UTF8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"                       # Caches pip downloads between runs
          cache-dependency-path: source/requirements.txt

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          pip --version

      - name: Verify project structure
        shell: pwsh
        run: |
          $root = Get-Location
          if (!(Test-Path "$root/run.py"))                     { throw "run.py not found" }
          if (!(Test-Path "$root/source/requirements.txt"))    { throw "source/requirements.txt not found" }
          if (!(Test-Path "$root/source/SC_BOT.py"))           { throw "source/SC_BOT.py not found" }
          New-Item -ItemType Directory -Force -Path "$root/Customize" | Out-Null
          if (!(Test-Path "$root/Customize/urls.txt"))       { Set-Content -Path "$root/Customize/urls.txt"       -Value "https://example.com/" }
          if (!(Test-Path "$root/Customize/spend_time.txt")) { Set-Content -Path "$root/Customize/spend_time.txt" -Value "60" }
          if (!(Test-Path "$root/Customize/bot_count.txt"))  { Set-Content -Path "$root/Customize/bot_count.txt"  -Value "1" }
          Write-Host "Project structure OK."

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r source/requirements.txt --quiet
          pip install blinker==1.7.0 --quiet
          pip install selenium-wire --no-deps --quiet

      - name: Show config
        shell: pwsh
        run: |
          Write-Host "URLs:"
          Get-Content Customize/urls.txt
          Write-Host "Stay (sec):"
          Get-Content Customize/spend_time.txt
          Write-Host "Bots:"
          Get-Content Customize/bot_count.txt

      - name: Run SpidyCrawler
        shell: pwsh
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8
        run: |
          python run.py

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spidycrawler-logs-${{ github.run_id }}
          path: Logs
          if-no-files-found: warn
          retention-days: 7
